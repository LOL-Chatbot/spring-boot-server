server:
  port: 8080

spring:
  application:
    name: lol-chatbot-back

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://54.116.196.184}
    server-description: ${SWAGGER_SERVER_DESCRIPTION:EC2 개발 서버}
  fast-api:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    timeout-millis: ${FASTAPI_TIMEOUT_MILLIS:30000}
